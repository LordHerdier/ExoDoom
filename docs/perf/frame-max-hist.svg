  .title   { font-size: 14px; font-weight: 600; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1a1a19; }
    .ink     { fill: #f0efec; }
    .ink2    { fill: #c3c2b7; }
    .grid    { stroke: #33332f; }
    .axis    { stroke: #6f6e69; }
    .ref     { stroke: #c3c2b7; }
    .s1      { fill: #3987e5; }
    .s2      { fill: #d95926; }
    .s3      { fill: #199e70; }
    .whisker { stroke: #f0efec; }
  }
</style>
