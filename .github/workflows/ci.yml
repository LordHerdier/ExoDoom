name: ExoDoom CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # The "docker" driver runs in the same dockerd as plain `docker
          # build` (what the Makefile's docker-ci/docker-build/docker-test
          # targets call), so building here and letting `make docker-ci`
          # rebuild afterwards hits the same daemon-local BuildKit cache
          # instead of recompiling. The default docker-container driver runs
          # an isolated BuildKit instance that plain `docker build` can't see.
          driver: docker

      # The exodoom-build image compiles a full binutils+gcc cross-toolchain
      # from source (~13 min), which dominates CI time. Pre-build it here with
      # a GitHub Actions cache export/import so unchanged Dockerfile steps are
      # skipped entirely, then let `make docker-ci` proceed as normal -- its
      # own `docker build` for this same image will hit the daemon's cache
      # from this step (same driver, see above) and finish in seconds.
      - name: Build cross-compiler image (cached)
        run: |
          docker buildx build \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            -t exodoom-build \
            -f docker/Dockerfile.build \
            docker

      - name: Build + test (QEMU)
        run: |
          set -euo pipefail

          make docker-ci 2>&1 | tee build.log || true

          if grep -q "TESTS FAILED" build.log; then
            echo "One or more tests failed!"
            exit 1
          fi

          if ! grep -q "ALL TESTS PASSED" build.log; then
            echo "Test completion signal not found in serial output!"
            exit 1
          fi

      - name: Success
        run: echo "All kernel tests passed."
