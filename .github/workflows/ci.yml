name: ExoDoom CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Compute cross-compiler image tag
        id: cross-tag
        run: |
          echo "hash=$(sha256sum docker/Dockerfile.build | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/exodoom-build-cache" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The exodoom-build image compiles a full binutils+gcc cross-toolchain
      # from source, which dominates CI time. Pull-and-tag a previous build of
      # it (keyed on the Dockerfile's own hash) as `exodoom-build:latest`
      # before `make docker-ci` runs its own `docker build` -- Docker's normal
      # layer cache then matches against those layers and skips recompiling.
      # Best-effort: a cold cache (first run, or Dockerfile.build changed)
      # just means this pull misses and the toolchain builds from scratch.
      - name: Restore cross-compiler image from GHCR
        run: |
          docker pull "${{ steps.cross-tag.outputs.image }}:${{ steps.cross-tag.outputs.hash }}" \
            && docker tag "${{ steps.cross-tag.outputs.image }}:${{ steps.cross-tag.outputs.hash }}" exodoom-build:latest \
            || echo "No cached cross-compiler image found; will build from scratch."

      - name: Build + test (QEMU)
        run: |
          set -euo pipefail

          output="$(make docker-ci 2>&1 || true)"
          echo "$output"

          if grep -q "TESTS FAILED" <<<"$output"; then
            echo "One or more tests failed!"
            exit 1
          fi

          if ! grep -q "ALL TESTS PASSED" <<<"$output"; then
            echo "Test completion signal not found in serial output!"
            exit 1
          fi

      - name: Push cross-compiler image to GHCR
        if: always()
        run: |
          docker tag exodoom-build:latest "${{ steps.cross-tag.outputs.image }}:${{ steps.cross-tag.outputs.hash }}" \
            && docker push "${{ steps.cross-tag.outputs.image }}:${{ steps.cross-tag.outputs.hash }}" \
            || echo "Skipping push (image missing or no registry access)."

      - name: Success
        run: echo "All kernel tests passed."
