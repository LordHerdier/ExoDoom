name: ExoDoom CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # The exodoom-build image compiles a full binutils+gcc cross-toolchain
      # from source (~13 min), which dominates CI time. This tells the
      # Makefile's `docker buildx build` (see BUILDX_CACHE_ARGS there) to
      # import/export its layers via the GitHub Actions cache, so unchanged
      # Dockerfile.build steps are skipped on later runs instead of
      # recompiling from scratch. Requires the docker-container driver set up
      # below -- it's the only driver that supports cache export.
      BUILDX_CACHE_ARGS: --cache-from type=gha --cache-to type=gha,mode=max

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # type=gha cache import/export needs ACTIONS_CACHE_URL/ACTIONS_RUNTIME_TOKEN
      # exposed as env vars -- setup-buildx-action alone doesn't do this for a
      # plain `run:` step, so cache-from/cache-to silently no-op without it.
      - name: Expose GitHub Actions runtime for buildx cache
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Build + test (QEMU)
        run: |
          set -euo pipefail

          make docker-ci 2>&1 | tee build.log || true

          if grep -q "TESTS FAILED" build.log; then
            echo "One or more tests failed!"
            exit 1
          fi

          if ! grep -q "ALL TESTS PASSED" build.log; then
            echo "Test completion signal not found in serial output!"
            exit 1
          fi

      # SCRUM-64 got all 79 files under src/doom/ compiling; this keeps them
      # that way. It reuses the exodoom-build image the step above already
      # built (and cached), so it costs one `docker run`, not another
      # toolchain compile.
      #
      # This is a COMPILE gate, not a link or a test: nothing in src/doom/ is
      # linked into build/exodoom yet, and much of what it calls still has no
      # definition (see docs/libc_audit.md). A green check here means the
      # vendored engine and the libc shim's headers still agree — no more.
      - name: Compile vendored Doom engine (src/doom)
        run: make docker-build-doom

      - name: Success
        run: echo "All kernel tests passed; src/doom compiles clean."
