set timeout=0
set default=0

insmod video
insmod video_fb
insmod gfxterm
insmod vbe
insmod vga
insmod all_video

loadfont /boot/grub/unicode.pf2

# Try to enter gfxterm; if it fails, we’ll still see text
terminal_output gfxterm

# Let GRUB pick a working mode, then keep it
set gfxmode=auto
set gfxpayload=keep

menuentry "exo" {
    insmod video
    insmod video_fb
    insmod gfxterm
    insmod vbe
    insmod vga
    insmod all_video

    set gfxpayload=keep
    multiboot2 /boot/exodoom
    # The IWAD must stay the FIRST module2 line: mmap_find_module()
    # (src/mmap.c) answers "where is the WAD" with the first module tag, and
    # GRUB emits these in config order. Anything added below is found by name
    # with mmap_find_module_named() instead.
    module2 /boot/freedoom2.wad freedoom2.wad
    # Boot animation frames, decoded by src/gif.c and played by
    # src/boot_anim.c before the boot log. The third word is the module's
    # command line, which is what BOOT_ANIM_MODULE (src/boot_anim.h) matches
    # on; docker/scripts/build.sh checks the two agree.
    module2 /boot/tenor.gif tenor.gif
}
